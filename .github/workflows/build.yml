name: Build APK

on:
  push:
    branches: [ main, 'claude/**' ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build debug APK
        run: ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: BawirBoard-debug
          path: app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30

      - name: Publish debug APK to a Release
        if: github.event_name == 'push'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: debug-build
          name: BawirBoard (latest debug build)
          prerelease: true
          body: |
            Latest debug build of BawirBoard, installable on Android.
            Built from `${{ github.ref_name }}` at commit ${{ github.sha }}.
          files: app/build/outputs/apk/debug/app-debug.apk
